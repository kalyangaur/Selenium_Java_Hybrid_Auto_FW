name: selenium-automation

services:
  selenium-hub:
    image: selenium/hub:${SELENIUM_VERSION:-4.52.0}
    container_name: selenium-hub
    ports:
      - "4442:4442" # Event Bus publish
      - "4443:4443" # Event Bus subscribe
      - "4444:4444" # Grid UI and WebDriver endpoint
    networks:
      - selenium-grid
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chrome:
    image: selenium/node-chrome:${SELENIUM_VERSION:-4.52.0}
    container_name: selenium-chrome
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: ${CHROME_MAX_SESSIONS:-1}
      SE_NODE_SESSION_TIMEOUT: "300"
    networks:
      - selenium-grid
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/status | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  firefox:
    image: selenium/node-firefox:${SELENIUM_VERSION:-4.52.0}
    container_name: selenium-firefox
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: ${FIREFOX_MAX_SESSIONS:-1}
      SE_NODE_SESSION_TIMEOUT: "300"
    networks:
      - selenium-grid
    restart: unless-stopped

  edge:
    image: selenium/node-edge:${SELENIUM_VERSION:-4.52.0}
    container_name: selenium-edge
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: ${EDGE_MAX_SESSIONS:-1}
      SE_NODE_SESSION_TIMEOUT: "300"
    networks:
      - selenium-grid
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/status | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: selenium-test-runner:local
    container_name: selenium-test-runner
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - maven-repository:/root/.m2
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444
      BROWSER: ${BROWSER:-chrome}
      HEADLESS: ${HEADLESS:-true}
      TESTNG_SUITE: ${TESTNG_SUITE:-SeleniumGrid_Docker.xml}
      # Override this from the command line if your project uses another suite path.
      MAVEN_ARGS: ${MAVEN_ARGS:-clean test}
    depends_on:
      selenium-hub:
        condition: service_healthy
      chrome:
        condition: service_healthy
      edge:
        condition: service_healthy
    networks:
      - selenium-grid
    profiles: ["tests"]
    command: ["sh", "-c", "mvn $${MAVEN_ARGS} -Dsurefire.suiteXmlFiles=$${TESTNG_SUITE}"]
    init: true

networks:
  selenium-grid:
    name: selenium-grid
    driver: bridge

volumes:
  maven-repository:
